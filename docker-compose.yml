services:
  venvy:
    build: .
    image: venvy:latest
    container_name: venvy
    restart: unless-stopped

    ports:
      # Bound to loopback by design. Venvy is an admin surface that can execute
      # code on the host — expose it through the Cloudflare Tunnel below, or a
      # reverse proxy, rather than straight onto the network.
      - "127.0.0.1:54783:54783"

    volumes:
      # Everything Venvy owns: data.db, apps/, backups/ and .venvy_key.
      # Back this up as a unit — the key and the database are useless apart.
      - venvy-data:/data

    environment:
      # Turn on once Venvy is reached over HTTPS, so the session cookie is
      # only ever sent on a secure connection.
      SESSION_COOKIE_SECURE: "0"
      # Restrict the UI to known addresses, e.g. "203.0.113.4,198.51.100.7".
      IP_ALLOWLIST: ""
      # Only needed when the UI is served from a different origin than the API.
      ALLOWED_ORIGINS: ""
      VENVY_LOG_LEVEL: "info"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:54783/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Managed apps are ordinary child processes; without an init, exiting ones
    # would accumulate as zombies.
    init: true

  # Publishes apps to the internet. Create the tunnel in the Cloudflare
  # dashboard, put its token in .env, then set the same account and tunnel ids
  # in Venvy's own settings so it can manage hostnames for you.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: venvy-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}"
    depends_on:
      - venvy
    profiles:
      # Opt in with: docker compose --profile tunnel up -d
      - tunnel

volumes:
  venvy-data:
