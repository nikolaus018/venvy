            <!-- App Dashboard -->
            <div id="dashboard" class="flex-1 flex flex-col hidden h-full w-full">

                <!-- App Header -->
                <header
                    class="flex flex-col md:flex-row md:items-center justify-between px-5 py-3 md:py-0 md:h-[60px] shrink-0 z-10 gap-3 md:gap-0"
                    style="background:var(--surface);border-bottom:1px solid var(--border)">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center"
                            style="background:var(--surface2);border:1px solid var(--border2)">
                            <i data-feather="box" class="w-4 h-4" style="color:var(--text3)"></i>
                        </div>
                        <div>
                            <h2 class="app-title text-lg leading-none" style="color:var(--text)" id="dash-title">App
                                Name</h2>
                            <div class="flex items-center gap-2 mt-1">
                                <span id="dash-status"
                                    class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide status-stopped">Stopped</span>
                                <span id="dash-health" class="hidden"></span>
                            </div>
                        </div>
                    </div>

                    <div
                        class="flex items-center justify-between md:justify-end gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0 scrollbar-hide">
                        <div class="flex gap-1.5">
                            <button onclick="controlApp('start')" id="btn-start" data-requires-operator
                                class="p-2 rounded-lg transition disabled:opacity-40 active:scale-95"
                                style="background:var(--green-dim);color:var(--green);border:1px solid var(--green-border)"
                                title="Start"><i data-feather="play" class="w-4 h-4"></i></button>
                            <button onclick="controlApp('restart')" id="btn-restart" data-requires-operator
                                class="p-2 rounded-lg transition disabled:opacity-40 active:scale-95"
                                style="background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-border)"
                                title="Restart"><i data-feather="refresh-cw" class="w-4 h-4"></i></button>
                            <button onclick="controlApp('stop')" id="btn-stop" data-requires-operator
                                class="p-2 rounded-lg transition disabled:opacity-40 active:scale-95"
                                style="background:var(--red-dim);color:var(--red);border:1px solid var(--red-border)"
                                title="Stop"><i data-feather="square" class="w-4 h-4"></i></button>
                        </div>
                        <div class="w-px h-5 mx-1 hidden md:block" style="background:var(--border)"></div>
                        <button onclick="openExternal()" id="btn-open"
                            class="h-9 px-4 rounded-xl flex items-center gap-2 font-semibold text-sm whitespace-nowrap active:scale-95 transition disabled:opacity-30 disabled:cursor-not-allowed ml-auto md:ml-0"
                            style="background:var(--surface3);color:var(--text2);border:1px solid var(--border2)">
                            Open <i data-feather="external-link" class="w-3 h-3"></i>
                        </button>
                    </div>
                </header>

                <!-- Tab Bar -->
                <div class="flex items-stretch shrink-0"
                    style="background:var(--surface);border-bottom:1px solid var(--border)">
                    <!-- Scrollable tab buttons -->
                    <div role="tablist" aria-label="Application sections" onkeydown="onTabListKey(event)"
                        class="flex-1 min-w-0 px-4 md:px-6 flex gap-5 text-sm font-medium overflow-x-auto overflow-y-hidden scrollbar-hide h-[44px]">
                        <button class="tab-btn active h-full whitespace-nowrap" data-requires-operator role="tab"
                            id="tabbtn-terminal" aria-controls="tab-terminal" aria-selected="true" data-tab="terminal"
                            title="Terminal (1)" onclick="switchTab('terminal')">Terminal</button>
                        <button class="tab-btn h-full whitespace-nowrap" data-requires-operator role="tab" id="tabbtn-files"
                            aria-controls="tab-files" aria-selected="false" data-tab="files" tabindex="-1"
                            title="Files (2)" onclick="switchTab('files')">Files</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-logs"
                            aria-controls="tab-logs" aria-selected="false" data-tab="logs" tabindex="-1"
                            title="Logs (3)" onclick="switchTab('logs')">Logs</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-packages"
                            aria-controls="tab-packages" aria-selected="false" data-tab="packages" tabindex="-1"
                            title="Packages (4)" onclick="switchTab('packages')">Packages</button>
                        <button class="tab-btn h-full whitespace-nowrap" data-requires-operator role="tab"
                            id="tabbtn-deploy" aria-controls="tab-deploy" aria-selected="false" data-tab="deploy"
                            tabindex="-1" title="Deploy (5)" onclick="switchTab('deploy')">Deploy</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-jobs"
                            aria-controls="tab-jobs" aria-selected="false" data-tab="jobs" tabindex="-1"
                            title="Jobs (6)" onclick="switchTab('jobs')">Jobs</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-settings"
                            aria-controls="tab-settings" aria-selected="false" data-tab="settings" tabindex="-1"
                            title="Settings (7)" onclick="switchTab('settings')">Settings</button>
                    </div>

                    <!-- Save Settings Button (Visible only on Settings tab) — outside scroll so always reachable -->
                    <div id="settings-save-container" class="hidden items-center px-3 shrink-0 h-[44px]">
                        <button id="settings-save-btn" onclick="saveSettings()" data-requires-operator
                            class="btn-primary px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2 active:scale-95 disabled:opacity-50">
                            <span id="save-status-dot"
                                class="w-1.5 h-1.5 rounded-full bg-orange-500 hidden animate-pulse"></span>
                            <span id="save-btn-text">Save</span>
                        </button>
                    </div>
                </div>

                <!-- Tab Content -->
                <div class="flex-1 overflow-hidden relative" style="background:var(--bg)">

                    <!-- include: partials/tabs/terminal.html -->

                    <!-- include: partials/tabs/files.html -->

                    <!-- include: partials/tabs/logs.html -->

                    <!-- include: partials/tabs/packages.html -->

                    <!-- include: partials/tabs/deploy.html -->

                    <!-- include: partials/tabs/jobs.html -->

                    <!-- include: partials/tabs/settings.html -->

                </div>
            </div>
