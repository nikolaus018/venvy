            <!-- App Dashboard -->
            <div id="dashboard" class="flex-1 flex flex-col hidden h-full w-full">

                <!-- App Header -->
                <header
                    class="flex flex-col md:flex-row md:items-center justify-between px-5 py-3 md:py-0 md:h-[60px] shrink-0 z-10 gap-3 md:gap-0"
                    style="background:var(--surface);border-bottom:1px solid var(--border)">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center"
                            style="background:var(--surface2);border:1px solid var(--border2)">
                            <i data-feather="box" class="w-4 h-4" style="color:var(--text3)"></i>
                        </div>
                        <div>
                            <h2 class="app-title text-lg leading-none" style="color:var(--text)" id="dash-title">App
                                Name</h2>
                            <div class="flex items-center gap-2 mt-1">
                                <span id="dash-status"
                                    class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide status-stopped">Stopped</span>
                                <span id="dash-health" class="hidden"></span>
                            </div>
                        </div>
                    </div>

                    <div
                        class="flex items-center justify-between md:justify-end gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0 scrollbar-hide">
                        <div class="flex gap-1.5">
                            <button data-on-click="controlApp('start')" id="btn-start" data-requires-operator
                                class="p-2 rounded-lg transition disabled:opacity-40 active:scale-95"
                                style="background:var(--green-dim);color:var(--green);border:1px solid var(--green-border)"
                                title="Start"><i data-feather="play" class="w-4 h-4"></i></button>
                            <button data-on-click="controlApp('restart')" id="btn-restart" data-requires-operator
                                class="p-2 rounded-lg transition disabled:opacity-40 active:scale-95"
                                style="background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-border)"
                                title="Restart"><i data-feather="refresh-cw" class="w-4 h-4"></i></button>
                            <button data-on-click="controlApp('stop')" id="btn-stop" data-requires-operator
                                class="p-2 rounded-lg transition disabled:opacity-40 active:scale-95"
                                style="background:var(--red-dim);color:var(--red);border:1px solid var(--red-border)"
                                title="Stop"><i data-feather="square" class="w-4 h-4"></i></button>
                        </div>
                        <div class="w-px h-5 mx-1 hidden md:block" style="background:var(--border)"></div>
                        <button data-on-click="openExternal()" id="btn-open"
                            class="h-9 px-4 rounded-xl flex items-center gap-2 font-semibold text-sm whitespace-nowrap active:scale-95 transition disabled:opacity-30 disabled:cursor-not-allowed ml-auto md:ml-0"
                            style="background:var(--surface3);color:var(--text2);border:1px solid var(--border2)">
                            Open <i data-feather="external-link" class="w-3 h-3"></i>
                        </button>
                        <div class="relative shrink-0">
                            <button id="btn-app-menu" data-on-click="toggleAppMenu()" aria-haspopup="menu" aria-expanded="false"
                                aria-controls="app-menu" title="More" aria-label="More actions for this app"
                                class="h-9 w-9 rounded-xl flex items-center justify-center active:scale-95 transition"
                                style="background:var(--surface3);color:var(--text2);border:1px solid var(--border2)">
                                <i data-feather="more-horizontal" class="w-4 h-4"></i>
                            </button>
                            <div id="app-menu" role="menu" class="hidden absolute right-0 top-11 z-40 w-56 rounded-xl p-1.5 shadow-xl"
                                style="background:var(--surface);border:1px solid var(--border2)">
                                <button role="menuitem" data-requires-operator data-on-click="toggleAppMenu(); duplicateApp()"
                                    class="w-full text-left px-3 py-2 rounded-lg text-sm flex items-center gap-2" style="color:var(--text)">
                                    <i data-feather="copy" class="w-4 h-4"></i> Duplicate…</button>
                                <button role="menuitem" data-requires-operator data-on-click="toggleAppMenu(); switchTab('data')"
                                    class="w-full text-left px-3 py-2 rounded-lg text-sm flex items-center gap-2" style="color:var(--text)">
                                    <i data-feather="download-cloud" class="w-4 h-4"></i> Back up or export…</button>
                                <div class="my-1" style="border-top:1px solid var(--border)"></div>
                                <button role="menuitem" data-requires-operator data-on-click="toggleAppMenu(); deleteApp()"
                                    class="w-full text-left px-3 py-2 rounded-lg text-sm flex items-center gap-2" style="color:var(--red)">
                                    <i data-feather="trash-2" class="w-4 h-4"></i> Delete…</button>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- Tab Bar -->
                <div class="flex items-stretch shrink-0"
                    style="background:var(--surface);border-bottom:1px solid var(--border)">
                    <!-- Scrollable tab buttons -->
                    <div role="tablist" aria-label="Application sections" data-on-keydown="onTabListKey(event)"
                        class="flex-1 min-w-0 px-4 md:px-6 flex gap-5 text-sm font-medium overflow-x-auto overflow-y-hidden scrollbar-hide h-[44px]">
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-overview"
                            aria-controls="tab-overview" aria-selected="false" data-tab="overview" tabindex="-1"
                            title="Overview (1)" data-on-click="switchTab('overview')">Overview</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-code"
                            aria-controls="tab-code" aria-selected="false" data-tab="code" tabindex="-1"
                            title="Code (2)" data-on-click="switchTab('code')">Code</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-deploy" data-requires-operator
                            aria-controls="tab-deploy" aria-selected="false" data-tab="deploy" tabindex="-1"
                            title="Deploy (3)" data-on-click="switchTab('deploy')">Deploy</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-network"
                            aria-controls="tab-network" aria-selected="false" data-tab="network" tabindex="-1"
                            title="Network (4)" data-on-click="switchTab('network')">Network</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-config"
                            aria-controls="tab-config" aria-selected="false" data-tab="config" tabindex="-1"
                            title="Config (5)" data-on-click="switchTab('config')">Config</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-health"
                            aria-controls="tab-health" aria-selected="false" data-tab="health" tabindex="-1"
                            title="Health (6)" data-on-click="switchTab('health')">Health</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-data"
                            aria-controls="tab-data" aria-selected="false" data-tab="data" tabindex="-1"
                            title="Data (7)" data-on-click="switchTab('data')">Data</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-logs"
                            aria-controls="tab-logs" aria-selected="false" data-tab="logs" tabindex="-1"
                            title="Logs (8)" data-on-click="switchTab('logs')">Logs</button>
                        <button class="tab-btn h-full whitespace-nowrap" role="tab" id="tabbtn-jobs"
                            aria-controls="tab-jobs" aria-selected="false" data-tab="jobs" tabindex="-1"
                            title="Jobs (9)" data-on-click="switchTab('jobs')">Jobs</button>
                    </div>

                    <!-- Save button of the app's settings (on the tabs that have some) — outside the scroller so it is always reachable -->
                    <div id="settings-save-container" class="hidden items-center px-3 shrink-0 h-[44px]">
                        <!-- Auto-save status indicator -->
                        <div id="autosave-indicator" class="hidden flex items-center gap-1.5 mr-2"
                            style="color:var(--text3)">
                            <svg id="autosave-spinner" class="hidden w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 12a9 9 0 11-6.219-8.56" />
                            </svg>
                            <svg id="autosave-check" class="hidden w-3.5 h-3.5" fill="none" stroke="var(--green)"
                                viewBox="0 0 24 24" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                            </svg>
                            <span id="autosave-text" class="text-xs font-medium"></span>
                        </div>
                        <button id="settings-save-btn" data-on-click="saveSettings()" data-requires-operator
                            class="btn-primary px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2 active:scale-95 disabled:opacity-50">
                            <span id="save-status-dot"
                                class="w-1.5 h-1.5 rounded-full bg-orange-500 hidden animate-pulse"></span>
                            <span id="save-btn-text">Save</span>
                        </button>
                    </div>
                </div>

                <!-- Code: Terminal, Files and Packages, one row below the tabs -->
                <div id="code-subnav" role="tablist" aria-label="Code" data-on-keydown="onCodeTabKey(event)"
                    class="hidden shrink-0 items-center gap-1 px-4 md:px-6 h-[38px] overflow-x-auto scrollbar-hide"
                    style="background:var(--surface);border-bottom:1px solid var(--border)">
                    <button class="code-tab px-3 py-1 rounded-lg text-xs font-semibold" role="tab" id="tabbtn-terminal" data-requires-operator
                        aria-controls="tab-terminal" aria-selected="false" tabindex="-1" data-on-click="switchTab('terminal')">Terminal</button>
                    <button class="code-tab px-3 py-1 rounded-lg text-xs font-semibold" role="tab" id="tabbtn-files" data-requires-operator
                        aria-controls="tab-files" aria-selected="false" tabindex="-1" data-on-click="switchTab('files')">Files</button>
                    <button class="code-tab px-3 py-1 rounded-lg text-xs font-semibold" role="tab" id="tabbtn-packages"
                        aria-controls="tab-packages" aria-selected="false" tabindex="-1" data-on-click="switchTab('packages')">Packages</button>
                </div>

                <!-- Tab Content -->
                <div class="flex-1 overflow-hidden relative" style="background:var(--bg)">

                </div>
            </div>
