    <!-- PWA Install Banner -->
    <div id="pwa-install-banner" class="rounded-xl shadow-lg overflow-hidden"
        style="background:var(--surface);border:1px solid var(--border2);display:none">
        <div class="px-4 py-3.5 flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0"
                style="background:var(--ov-strong);border:1px solid var(--ov-border)">
                <svg class="w-4 h-4" fill="none" stroke="var(--text)" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 18.5a6.5 6.5 0 100-13 6.5 6.5 0 000 13z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l2 2" />
                </svg>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold" style="color:var(--text)">Install Venvy</p>
                <p class="text-xs" style="color:var(--text3)">Add to home screen for the best experience</p>
            </div>
            <button onclick="dismissPwaBanner()" class="p-1.5 rounded-lg transition" style="color:var(--text3)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="px-4 pb-3.5">
            <button onclick="triggerPwaInstall()"
                class="w-full py-2.5 text-sm font-bold rounded-xl transition active:scale-95"
                style="background:var(--accent);color:white">Install</button>
        </div>
    </div>
