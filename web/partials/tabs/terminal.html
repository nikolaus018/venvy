                    <!-- TERMINAL -->
                    <div id="tab-terminal" class="tab-content absolute inset-0 overflow-hidden flex flex-col"
                        style="background:var(--surface);">

                        <!-- Toolbar: always one slim row -->
                        <div id="term-toolbar" class="shrink-0 flex items-center gap-1.5 px-2"
                            style="height:40px;background:var(--surface2);border-bottom:1px solid var(--border2);">

                            <!-- Jail badge -->
                            <div class="flex items-center gap-1 px-1.5 py-0.5 rounded shrink-0"
                                title="This shell is confined to the application directory — it cannot reach the rest of the host filesystem."
                                style="background:rgba(48,209,88,0.08);border:1px solid rgba(48,209,88,0.2)">
                                <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="var(--green)"
                                    stroke-width="2.5">
                                    <rect x="3" y="11" width="18" height="11" rx="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                                <span class="text-[10px] font-bold tracking-wide"
                                    style="color:var(--green);font-family:'JetBrains Mono',monospace">JAILED</span>
                            </div>

                            <!-- App label — desktop only -->
                            <span id="term-app-label" class="text-xs font-medium truncate hidden md:block"
                                style="color:var(--text2);font-family:'JetBrains Mono',monospace;max-width:140px">~/app</span>

                            <!-- Spacer -->
                            <div class="flex-1"></div>

                            <!-- Global quick-keys -->
                            <div class="flex items-center gap-1">
                                <button onclick="termSend('\x03')" class="term-key" title="Ctrl+C">^C</button>
                                <button onclick="termSend('\x04')" class="term-key" title="Ctrl+D">^D</button>
                                <button onclick="termSend('\t')" class="term-key hidden md:block">Tab</button>
                            </div>
                            <div class="w-px h-5 shrink-0 mx-1" style="background:var(--border2)"></div>

                            <!-- Clear + reconnect + status (always visible) -->
                            <button onclick="_termClear()" title="Clear" class="term-action-btn">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                    stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                            <button onclick="_termReconnect()" id="term-reconnect-btn" title="Reconnect"
                                class="term-action-btn">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                    stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                            </button>
                            <div id="term-status-dot" title="Disconnected"
                                class="w-2 h-2 rounded-full shrink-0 ml-1 transition" style="background:var(--surface4)">
                            </div>
                        </div>

                        <!-- xterm.js mount — fills all available space -->
                        <div id="terminal-container" class="flex-1 overflow-hidden min-h-0" style="padding:0"
                            onclick="if(window.term) window.term.focus()"></div>

                        <!-- Mobile quick-key keyboard — stacks above the soft keyboard -->
                        <!-- Row 1: always visible primary keys -->
                        <div id="term-mobile-keys" class="md:hidden shrink-0 flex flex-col"
                            style="background:var(--surface);border-top:1px solid var(--border2);">

                            <!-- Primary row -->
                            <div class="flex items-center gap-1 px-2 py-1.5 overflow-x-auto scrollbar-hide"
                                style="touch-action:pan-x;">
                                <!-- Sticky Ctrl modifier -->
                                <button id="mob-ctrl-btn" onclick="termModToggle('ctrl')"
                                    class="term-mob-key mod-accent-blue font-bold tracking-wider"
                                    style="min-width:46px;"
                                    title="Sticky Ctrl — tap then press another key">Ctrl</button>

                                <!-- Sticky Alt modifier -->
                                <button id="mob-alt-btn" onclick="termModToggle('alt')"
                                    class="term-mob-key mod-accent-purple font-bold tracking-wider"
                                    style="min-width:40px;" title="Sticky Alt">Alt</button>

                                <div class="w-px h-6 shrink-0 mx-0.5" style="background:var(--border2)"></div>

                                <!-- Tab -->
                                <button onclick="termMobKey('\t')" class="term-mob-key shrink-0"
                                    style="min-width:42px;">Tab</button>

                                <!-- Arrows -->
                                <button onclick="termMobKey('\x1b[A')" class="term-mob-key shrink-0"
                                    style="min-width:36px;font-size:16px;">↑</button>
                                <button onclick="termMobKey('\x1b[B')" class="term-mob-key shrink-0"
                                    style="min-width:36px;font-size:16px;">↓</button>
                                <button onclick="termMobKey('\x1b[D')" class="term-mob-key shrink-0"
                                    style="min-width:36px;font-size:16px;">←</button>
                                <button onclick="termMobKey('\x1b[C')" class="term-mob-key shrink-0"
                                    style="min-width:36px;font-size:16px;">→</button>

                                <div class="w-px h-6 shrink-0 mx-0.5" style="background:var(--border2)"></div>

                                <!-- Backspace -->
                                <button onclick="termMobKey('\x7f')" class="term-mob-key shrink-0"
                                    style="min-width:42px;font-size:15px;">⌫</button>
                                <!-- Esc -->
                                <button onclick="termMobKey('\x1b')" class="term-mob-key shrink-0"
                                    style="min-width:38px;">Esc</button>

                                <div class="w-px h-6 shrink-0 mx-0.5" style="background:var(--border2)"></div>

                                <!-- Expand/collapse more row -->
                                <button id="mob-more-btn" onclick="termMobToggleMore()" class="term-mob-key ml-auto"
                                    style="min-width:36px;font-size:15px;" title="More keys">⋯</button>
                            </div>

                            <!-- Secondary row: hidden by default, toggled by ⋯ -->
                            <div id="term-mob-more-row"
                                class="hidden flex items-center gap-1 px-2 pb-1.5 overflow-x-auto scrollbar-hide"
                                style="touch-action:pan-x;">
                                <!-- Ctrl shortcuts -->
                                <button onclick="termMobKey('\x03')" class="term-mob-key shrink-0"
                                    style="min-width:36px;color:var(--red);" title="Ctrl+C — interrupt">^C</button>
                                <button onclick="termMobKey('\x04')" class="term-mob-key shrink-0"
                                    style="min-width:36px;color:var(--text);" title="Ctrl+D — EOF/logout">^D</button>
                                <button onclick="termMobKey('\x1a')" class="term-mob-key shrink-0"
                                    style="min-width:36px;color:var(--text);" title="Ctrl+Z — suspend">^Z</button>
                                <button onclick="termMobKey('\x0c')" class="term-mob-key shrink-0"
                                    style="min-width:36px;color:var(--green);" title="Ctrl+L — clear">^L</button>
                                <button onclick="termMobKey('\x01')" class="term-mob-key shrink-0"
                                    style="min-width:36px;" title="Ctrl+A — line start">^A</button>
                                <button onclick="termMobKey('\x05')" class="term-mob-key shrink-0"
                                    style="min-width:36px;" title="Ctrl+E — line end">^E</button>
                                <button onclick="termMobKey('\x15')" class="term-mob-key shrink-0"
                                    style="min-width:36px;" title="Ctrl+U — clear line">^U</button>
                                <button onclick="termMobKey('\x17')" class="term-mob-key shrink-0"
                                    style="min-width:36px;" title="Ctrl+W — delete word">^W</button>
                                <button onclick="termMobKey('\x0b')" class="term-mob-key shrink-0"
                                    style="min-width:36px;" title="Ctrl+K — kill to end">^K</button>

                                <div class="w-px h-6 shrink-0 mx-0.5" style="background:var(--border2)"></div>

                                <!-- Special chars often needed in terminal -->
                                <button onclick="termMobKey('/')" class="term-mob-key shrink-0"
                                    style="min-width:30px;">/</button>
                                <button onclick="termMobKey('~')" class="term-mob-key shrink-0"
                                    style="min-width:30px;">~</button>
                                <button onclick="termMobKey('-')" class="term-mob-key shrink-0"
                                    style="min-width:30px;">-</button>
                                <button onclick="termMobKey('.')" class="term-mob-key shrink-0"
                                    style="min-width:30px;">.</button>
                                <button onclick="termMobKey('|')" class="term-mob-key shrink-0"
                                    style="min-width:30px;">|</button>
                                <button onclick="termMobKey('>')" class="term-mob-key shrink-0"
                                    style="min-width:30px;">&gt;</button>
                                <button onclick="termMobKey('\n')" class="term-mob-key shrink-0"
                                    style="min-width:46px;color:var(--green);">↵ Enter</button>
                            </div>
                        </div>
                    </div>
