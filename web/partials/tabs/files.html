                    <!-- FILES -->
                    <div id="tab-files"
                        class="tab-content absolute inset-0 md:inset-4 hidden flex flex-col md:flex-row rounded-none md:rounded-xl overflow-hidden pb-safe-content md:pb-0"
                        style="background:var(--surface);border:1px solid var(--border)">
                        <!-- File Tree -->
                        <div class="w-full md:w-64 flex flex-col relative h-full file-panel-transition z-10"
                            id="file-tree-container" style="border-right:1px solid var(--border)">
                            <!-- Toolbar -->
                            <div class="px-3 py-2.5 flex gap-1.5 shrink-0 items-center overflow-x-auto scrollbar-hide"
                                style="border-bottom:1px solid var(--border);background:var(--surface2)">
                                <button data-on-click="fileOp('refresh')" class="p-2 rounded-lg transition"
                                    style="color:var(--text3)" title="Refresh"><i data-feather="refresh-cw"
                                        class="w-3.5 h-3.5"></i></button>
                                <div class="w-px h-4 mx-0.5" style="background:var(--border)"></div>
                                <button data-on-click="promptFileOp('create_folder')" class="p-2 rounded-lg transition"
                                    style="color:var(--text3)" title="New Folder"><i data-feather="folder-plus"
                                        class="w-3.5 h-3.5"></i></button>
                                <button data-on-click="promptFileOp('create_file')" class="p-2 rounded-lg transition"
                                    style="color:var(--text3)" title="New File"><i data-feather="file-plus"
                                        class="w-3.5 h-3.5"></i></button>
                                <label class="p-2 rounded-lg cursor-pointer transition ml-auto"
                                    style="color:var(--text3)" title="Upload">
                                    <i data-feather="upload-cloud" class="w-3.5 h-3.5"></i>
                                    <input type="file" class="hidden" multiple data-on-change="uploadFile(this)">
                                </label>
                            </div>
                            <!-- Breadcrumb -->
                            <div class="px-3 py-1.5 text-xs mono flex items-center gap-1.5 overflow-hidden"
                                style="background:var(--bg);border-bottom:1px solid var(--border);color:var(--text3)">
                                <i data-feather="home"
                                    class="w-3 h-3 shrink-0 cursor-pointer hover:text-white transition"
                                    data-on-click="loadFiles('')" title="Root"></i>
                                <div id="current-browser-path" class="truncate flex items-center gap-1"></div>
                            </div>
                            <div id="file-tree" class="flex-1 overflow-y-auto p-2 text-sm space-y-0.5 relative"></div>
                            <!-- Global Drop Overlay -->
                            <div id="file-drop-overlay"
                                class="absolute inset-0 z-50 flex flex-col items-center justify-center p-6 hidden opacity-0 transition-opacity duration-200 pointer-events-none"
                                style="background:rgba(0,0,0,0.8); backdrop-filter:blur(4px);">
                                <div class="w-16 h-16 rounded-xl flex items-center justify-center mb-4 scale-90 transition-transform duration-200 group-hover:scale-100"
                                    style="background:rgba(var(--accent-rgb),0.2); border:2px dashed var(--accent);">
                                    <i data-feather="upload-cloud" class="w-8 h-8" style="color:var(--text)"></i>
                                </div>
                                <p class="text-sm font-bold text-white text-center">Drop files to upload</p>
                                <p class="text-xs text-center mt-1" style="color:var(--text3)">to current folder</p>
                            </div>
                        </div>

                        <!-- Editor -->
                        <div id="editor-panel"
                            class="absolute md:static inset-0 flex flex-col transform translate-x-full md:translate-x-0 file-panel-transition z-20 md:flex-1 w-full min-w-0"
                            style="background:var(--surface)">
                            <div class="h-11 flex items-center justify-between px-3 shrink-0 shadow-sm z-10"
                                style="border-bottom:1px solid var(--border);background:var(--surface2)">
                                <div class="flex items-center gap-2 min-w-0 flex-1">
                                    <button data-on-click="closeEditorMobile()" class="md:hidden p-1.5 rounded-md -ml-1"
                                        style="color:var(--text3)">
                                        <i data-feather="arrow-left" class="w-4 h-4"></i>
                                    </button>
                                    <span id="current-filename" class="text-xs mono truncate"
                                        style="color:var(--text2)">No file open</span>
                                </div>
                                <div class="flex items-center gap-2 ml-2">
                                    <span id="editor-dirty-indicator" class="hidden w-2 h-2 rounded-full shrink-0"
                                        style="background:var(--yellow)" title="Unsaved changes"></span>
                                    <button data-on-click="aceSearch()" class="p-1.5 rounded-lg transition"
                                        style="color:var(--text3)" title="Search (Ctrl+F)"><i data-feather="search"
                                            class="w-3.5 h-3.5"></i></button>
                                    <button data-on-click="downloadCurrentFile()" class="p-1.5 rounded-lg transition"
                                        style="color:var(--text3)" title="Download"><i data-feather="download"
                                            class="w-3.5 h-3.5"></i></button>
                                    <button id="editor-save-btn" data-on-click="saveCurrentFile()"
                                        class="text-xs btn-primary px-3 py-1.5 rounded-lg text-sm font-medium">Save</button>
                                </div>
                            </div>
                            <div id="file-editor" class="flex-1" style="background:var(--surface)"></div>
                        </div>
                    </div>
