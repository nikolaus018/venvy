    <!-- Auth / Login Screen -->
    <div id="auth-screen" class="fixed inset-0 z-[70] overflow-y-auto hidden">
        <div class="min-h-full flex items-center justify-center p-4">
            <div class="auth-card w-full max-w-sm p-9 relative fade-up">
                <div class="relative text-center mb-8">
                    <div class="flex items-center justify-center mb-5">
                        <h1 class="text-4xl brand-text" style="letter-spacing:-0.06em"><span style="color:var(--accent)">V</span>envy</h1>
                    </div>
                    <p class="text-sm mt-2" id="auth-msg" style="color:var(--text3)">Sign in to manage your applications</p>
                </div>
                <form id="login-form" class="space-y-3">
                    <div id="login-step-password" class="space-y-3">
                        <input type="text" id="setup-code" placeholder="Setup code" autocomplete="off"
                            spellcheck="false" class="hidden inp w-full px-4 py-3.5 text-sm font-medium mono">
                        <input type="text" id="username" placeholder="Username" autocomplete="username"
                            class="inp w-full px-4 py-3.5 text-sm font-medium">
                        <input type="password" id="password" placeholder="Password" autocomplete="current-password"
                            class="inp w-full px-4 py-3.5 text-sm font-medium">
                    </div>
                    <div id="login-step-totp" class="hidden space-y-3">
                        <div class="flex items-center gap-2.5 px-4 py-3 rounded-xl text-xs"
                            style="background:rgba(var(--accent-rgb),0.08);border:1px solid rgba(var(--accent-rgb),0.18);color:var(--accent-light)">
                            <i data-feather="shield" class="w-3.5 h-3.5 shrink-0"></i>
                            <span>Enter the 6-digit code from your authenticator app.</span>
                        </div>
                        <input type="text" id="totp-code" placeholder="000 000" autocomplete="one-time-code"
                            inputmode="numeric" maxlength="6"
                            class="inp w-full px-4 py-3.5 text-lg font-semibold mono text-center tracking-[0.5em]">
                        <button type="button" data-on-click="cancelTotpStep()"
                            class="btn-ghost w-full py-2.5 text-sm font-medium rounded-xl">← Back</button>
                    </div>
                    <button type="submit" class="btn-primary w-full py-4 text-sm font-semibold mt-1"
                        id="login-submit-btn" style="border-radius:12px">
                        Sign In
                    </button>
                </form>
                <div id="setup-hint" class="hidden mt-5 text-center text-xs rounded-xl py-3 px-4"
                    style="background:rgba(var(--accent-rgb),0.07);color:var(--text3);border:1px solid rgba(var(--accent-rgb),0.15)">
                    Welcome — create your admin account to get started.
                    The setup code is in the server log (<span class="mono">journalctl -u venvy</span>)
                    and in the <span class="mono">.setup-code</span> file in Venvy's data directory.
                </div>
            </div>
        </div>
    </div>
