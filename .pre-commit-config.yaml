# Install with:  pre-commit install
# Run over everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      # Venvy's own secrets must never be committed.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/venvy/
        additional_dependencies:
          - fastapi
          - sqlmodel
          - pydantic
          - types-aiofiles

  - repo: local
    hooks:
      # The frontend has no build step, so nothing else would catch a broken
      # import until the page came up blank.
      - id: check-frontend-modules
        name: check the frontend module graph
        entry: node tools/check-modules.mjs
        language: system
        files: ^src/venvy/web/
        pass_filenames: false
