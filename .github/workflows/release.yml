# Pushing a tag like v4.1.0 builds and publishes a release:
#   venvy.tar.gz          the code (main.py, venvy/, web/, vendor/, requirements.txt, VERSION)
#   venvy.tar.gz.sha256   its checksum, verified by the installer
#   install.sh            the installer / updater (also inside the archive, for updates from the UI)
#   VERSION               the release's tag: how a running Venvy learns there is a newer one
#   CHANGELOG.md          what changed, shown in Venvy's "What's new"; the tag's section is the release text
# Asset names are fixed so /releases/latest/download/<name> always works.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One release per tag, even if the push event is delivered twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          grep -v '^playwright' tests/requirements.txt | pip install -r /dev/stdin

      - name: Smoke test (boots a real server; a red test publishes nothing)
        working-directory: tests
        env:
          SMOKE_EXPECT_SHUTDOWN_LOG: "1"
        run: python smoke.py ..

      - name: Check the installer parses
        run: bash -n install.sh

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="## ${GITHUB_REF_NAME}" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md \
            | sed -e '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section '## ${GITHUB_REF_NAME}' — add one before tagging."
            exit 1
          fi
          cat notes.md

      - name: Build the release archive
        run: |
          echo "${GITHUB_REF_NAME}" > VERSION
          tar --owner=0 --group=0 --exclude='__pycache__' -czf venvy.tar.gz \
            main.py requirements.txt VERSION install.sh venvy web vendor
          sha256sum venvy.tar.gz > venvy.tar.gz.sha256
          cat venvy.tar.gz.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; nothing to publish."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" venvy.tar.gz venvy.tar.gz.sha256 install.sh VERSION CHANGELOG.md --title "Venvy ${GITHUB_REF_NAME}" --notes-file notes.md
