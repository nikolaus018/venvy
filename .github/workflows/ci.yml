name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,metrics]"

      - name: Ruff (lint)
        run: ruff check --output-format=github src tests tools

      - name: Ruff (format)
        run: ruff format --check --diff src tests tools

      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,metrics]"

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  test-minimal:
    name: Tests without optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # psutil is optional. Venvy must degrade to its /proc-based fallbacks
      # rather than fail, so the suite runs once without it.
      - name: Install without psutil
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci || npm install

      - name: ESLint
        run: npm run lint

      - name: Check the module graph resolves
        run: npm run check:modules

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          python -m pip install build twine
          python -m build

      - name: Check metadata
        run: twine check dist/*

      # Proves the wheel ships the frontend: installing it into a clean
      # environment and importing must find index.html and the module tree.
      - name: Verify the wheel is self-contained
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet dist/*.whl
          /tmp/probe/bin/python - <<'PY'
          from pathlib import Path
          import venvy
          web = Path(venvy.__file__).parent / "web"
          assert (web / "index.html").is_file(), "index.html missing from the wheel"
          assert (web / "js" / "main.js").is_file(), "frontend modules missing from the wheel"
          assert list((web / "styles").glob("*.css")), "stylesheets missing from the wheel"
          from venvy.app import create_app
          assert create_app() is not None
          print("wheel is self-contained")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
